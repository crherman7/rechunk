<svg xmlns="http://www.w3.org/2000/svg" width="920" height="248" viewBox="0 0 920 248" role="img" aria-label="ReChunk target architecture">
  <title>ReChunk target architecture</title>
  <rect width="920" height="248" fill="#eeeeee"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0a7a38"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">
    <rect x="8" y="48" width="160" height="92" rx="10" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.5"/>
    <text x="88" y="84" text-anchor="middle" font-size="14" font-weight="600" fill="#121212">"use rechunk"</text>
    <text x="88" y="108" text-anchor="middle" font-size="12" fill="#4d4d4d">host proxy</text>

    <rect x="200" y="48" width="160" height="92" rx="10" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.5"/>
    <text x="280" y="84" text-anchor="middle" font-size="14" font-weight="600" fill="#121212">Metro + withRechunk</text>
    <text x="280" y="108" text-anchor="middle" font-size="12" fill="#4d4d4d">/__rechunk/*</text>

    <rect x="392" y="48" width="160" height="92" rx="10" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.5"/>
    <text x="472" y="84" text-anchor="middle" font-size="14" font-weight="600" fill="#121212">On-demand build</text>
    <text x="472" y="108" text-anchor="middle" font-size="12" fill="#4d4d4d">signed artifact</text>

    <rect x="584" y="48" width="150" height="92" rx="10" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.5"/>
    <text x="659" y="84" text-anchor="middle" font-size="14" font-weight="600" fill="#121212">Verify + eval</text>
    <text x="659" y="108" text-anchor="middle" font-size="12" fill="#4d4d4d">RS256 · evalx</text>

    <rect x="766" y="48" width="146" height="92" rx="10" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.5"/>
    <text x="839" y="84" text-anchor="middle" font-size="14" font-weight="600" fill="#121212">Host React</text>
    <text x="839" y="108" text-anchor="middle" font-size="12" fill="#4d4d4d">Fast Refresh</text>
  </g>
  <g stroke="#0a7a38" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="168" y1="94" x2="194" y2="94"/>
    <line x1="360" y1="94" x2="386" y2="94"/>
    <line x1="552" y1="94" x2="578" y2="94"/>
    <line x1="734" y1="94" x2="760" y2="94"/>
  </g>
  <text x="460" y="188" text-anchor="middle" font-size="13" fill="#4d4d4d" font-family="ui-sans-serif, system-ui, Helvetica Neue, Arial, sans-serif">One process: expo start / react-native start. Real remote artifact. No second port.</text>
  <text x="460" y="214" text-anchor="middle" font-size="12" fill="#4d4d4d" font-family="ui-sans-serif, system-ui, Helvetica Neue, Arial, sans-serif">Local development needs no cloud account. Core stays open source; Cloud is optional.</text>
</svg>
