<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220" role="img" aria-label="ReChunk load pipeline">
  <title>How ReChunk loads a component</title>
  <rect width="920" height="220" fill="#eeeeee"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0a7a38"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">
    <rect x="8" y="58" width="150" height="84" rx="10" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.5"/>
    <text x="83" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#121212">"use rechunk"</text>
    <text x="83" y="118" text-anchor="middle" font-size="12" fill="#4d4d4d">Babel host proxy</text>
    <rect x="198" y="58" width="150" height="84" rx="10" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.5"/>
    <text x="273" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#121212">React.lazy</text>
    <text x="273" y="118" text-anchor="middle" font-size="12" fill="#4d4d4d">importChunk()</text>
    <rect x="388" y="58" width="150" height="84" rx="10" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.5"/>
    <text x="463" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#121212">Fetch + verify</text>
    <text x="463" y="118" text-anchor="middle" font-size="12" fill="#4d4d4d">RS256 signature</text>
    <rect x="578" y="58" width="150" height="84" rx="10" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.5"/>
    <text x="653" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#121212">evalx</text>
    <text x="653" y="118" text-anchor="middle" font-size="12" fill="#4d4d4d">metro-requirex</text>
    <rect x="768" y="58" width="144" height="84" rx="10" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.5"/>
    <text x="840" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#121212">Host React</text>
    <text x="840" y="118" text-anchor="middle" font-size="12" fill="#4d4d4d">shared runtime</text>
  </g>
  <g stroke="#0a7a38" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="158" y1="100" x2="192" y2="100"/>
    <line x1="348" y1="100" x2="382" y2="100"/>
    <line x1="538" y1="100" x2="572" y2="100"/>
    <line x1="728" y1="100" x2="762" y2="100"/>
  </g>
  <text x="460" y="200" text-anchor="middle" font-size="12" fill="#4d4d4d" font-family="ui-sans-serif, system-ui, Helvetica Neue, Arial, sans-serif">Same JS runtime as your app - hooks, context, and host native modules stay available</text>
</svg>
